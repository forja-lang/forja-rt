[package]
name = "forja-rt"
version = "0.9.6"
edition = "2021"
description = "Stub de ejecución autónomo ligero para Forja"
authors = ["forja-lang"]
license = "GPL-3.0-or-later"
repository = "https://github.com/forja-lang/forja"
homepage = "https://github.com/forja-lang/forja"
documentation = "https://docs.rs/forja-rt"
readme = "README.md"
keywords = ["forja", "runtime", "vm", "bytecode"]
categories = ["compilers", "development-tools"]

[dependencies]
forja = { path = "../.." }
forja-gui-rt = { path = "../forja-gui-rt", optional = true }

[features]
default = []
gui = ["forja-gui-rt"]
