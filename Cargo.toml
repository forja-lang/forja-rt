[package]
name = "forja-rt"
version = "0.11.0"
edition = "2021"
description = "Stub de ejecución autónomo ligero para Forja"
authors = ["forja-lang"]
license = "GPL-3.0-or-later"
repository = "https://github.com/forja-lang/forja"
homepage = "https://github.com/forja-lang/forja"
documentation = "https://docs.rs/forja-rt"
readme = "README.md"
keywords = ["forja", "runtime", "vm", "bytecode"]
categories = ["compilers", "development-tools"]

[dependencies]
forja = { path = "../../compiler/forja" }

[features]
default = []
# `forja-rt-gui`: habilita el payload de fuente GUI en `forja::selfrun`.
# (Antes activaba `forja-gui-rt` como dependencia suelta, que `main.rs` nunca usaba.)
gui = ["forja/gui"]
